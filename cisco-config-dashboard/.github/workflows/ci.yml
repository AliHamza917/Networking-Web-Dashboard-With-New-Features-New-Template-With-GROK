name: CI – Ali Hamza Networking Dashboard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "paramiko>=2.12,<4"
      - name: Verify app imports
        run: python -c "from app.main import app; print('OK:', app.title)"
      - name: Syntax check
        run: |
          python -m py_compile app/main.py
          python -m py_compile desktop_app.py
